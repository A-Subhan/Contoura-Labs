<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-adsense-account" content="ca-pub-1264117586848709">
  <title>Password Generator — Contoura Labs</title>
  <meta name="description" content="Generate strong, random passwords. Choose length, character sets, exclude ambiguous characters, and batch-generate 5 at once.">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {
        colors: {
          brand: { orange: '#FF6B35', red: '#E8384F', teal: '#00B8A9' },
          surface: { light: '#F8F9FA', dark: '#0A0A0A', card: '#1A1A1A', alt: '#111111' }
        },
        fontFamily: { sans: ['Inter', 'sans-serif'] }
      }}
    }
  </script>

</head>
<body class="font-sans bg-white text-gray-900 dark:bg-surface-dark dark:text-gray-100 antialiased">

  <div id="navbar-mount"></div>

  <main class="tool-page">
    <div class="tool-container">
      <header class="tool-header">
        <span class="badge mb-3">Generators</span>
        <h1 class="tool-title">Password <span class="gradient-text">Generator</span></h1>
        <p class="tool-subtitle">Strong, random, cryptographically-secure passwords — generated locally in your browser. Nothing is sent anywhere.</p>
      </header>

      <div class="tool-card">
        <!-- Big password display -->
        <div class="rounded-xl p-5 mb-6" style="background:#0a0a0a;border:1px solid #1f1f1f;">
          <div class="flex items-center justify-between gap-4">
            <code id="pw-display" class="text-lg sm:text-2xl font-mono break-all" style="color:#00B8A9;letter-spacing:0.02em;">—</code>
            <button id="copy-btn" class="shrink-0 btn-secondary" style="padding:0.5rem 0.85rem;">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 01-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 011.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 00-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 01-1.125-1.125v-9.25m12 6.625v-1.5a2.25 2.25 0 00-2.25-2.25h-2.5a2.25 2.25 0 01-2.25-2.25v-2.5A2.25 2.25 0 009.375 3h-1.5"/></svg>
            </button>
          </div>
          <div class="mt-3 flex items-center gap-3">
            <div class="flex-1 progress-bar" style="height:6px;">
              <div id="strength-fill" class="progress-bar-fill" style="width:0%;"></div>
            </div>
            <span id="strength-label" class="text-xs font-semibold text-gray-400">—</span>
          </div>
        </div>

        <!-- Length slider -->
        <div class="mb-5">
          <div class="flex items-center justify-between mb-2">
            <label class="field-label mb-0" for="length">Length</label>
            <span id="length-val" class="text-sm font-semibold text-brand-orange">16</span>
          </div>
          <input type="range" id="length" min="4" max="64" value="16"
                 class="w-full accent-brand-orange" style="height:6px;">
        </div>

        <!-- Options -->
        <div class="grid-2 mb-5">
          <label class="flex items-center gap-3 p-3 rounded-lg cursor-pointer hover:bg-gray-50 dark:hover:bg-white/5">
            <input type="checkbox" id="opt-upper" checked class="w-4 h-4 accent-brand-orange">
            <span class="text-sm font-medium">Uppercase (A–Z)</span>
          </label>
          <label class="flex items-center gap-3 p-3 rounded-lg cursor-pointer hover:bg-gray-50 dark:hover:bg-white/5">
            <input type="checkbox" id="opt-lower" checked class="w-4 h-4 accent-brand-orange">
            <span class="text-sm font-medium">Lowercase (a–z)</span>
          </label>
          <label class="flex items-center gap-3 p-3 rounded-lg cursor-pointer hover:bg-gray-50 dark:hover:bg-white/5">
            <input type="checkbox" id="opt-num" checked class="w-4 h-4 accent-brand-orange">
            <span class="text-sm font-medium">Numbers (0–9)</span>
          </label>
          <label class="flex items-center gap-3 p-3 rounded-lg cursor-pointer hover:bg-gray-50 dark:hover:bg-white/5">
            <input type="checkbox" id="opt-sym" checked class="w-4 h-4 accent-brand-orange">
            <span class="text-sm font-medium">Symbols (!@#$…)</span>
          </label>
          <label class="flex items-center gap-3 p-3 rounded-lg cursor-pointer hover:bg-gray-50 dark:hover:bg-white/5 col-span-2">
            <input type="checkbox" id="opt-no-amb" class="w-4 h-4 accent-brand-orange">
            <span class="text-sm font-medium">Exclude ambiguous (0, O, 1, l, I)</span>
          </label>
        </div>

        <div class="flex flex-wrap gap-3">
          <button class="btn-primary" id="generate-btn">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>
            Generate
          </button>
          <button class="btn-secondary" id="batch-btn">Generate 5 passwords</button>
        </div>

        <!-- Batch results -->
        <div id="batch-wrap" class="mt-6 hidden">
          <h3 class="font-semibold mb-3">Batch results</h3>
          <div id="batch-list" class="space-y-2"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-8 border-t border-gray-100 dark:border-white/5 mt-12">
    <div class="max-w-6xl mx-auto px-6 flex flex-col sm:flex-row items-center justify-between gap-3">
      <p class="text-xs text-gray-400">© 2025 Contoura Labs</p>
      <a href="index.html" class="text-xs text-brand-orange hover:text-brand-red transition-colors">← Back to all tools</a>
    </div>
  </footer>

  <script src="../assets/js/common.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const UPPER = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const LOWER = 'abcdefghijklmnopqrstuvwxyz';
    const NUMS = '0123456789';
    const SYMS = '!@#$%^&*()-_=+[]{};:,.<>?/';
    const AMBIG = '0O1lI';

    // Cryptographically-secure integer in [0, max)
    function randInt(max) {
      const arr = new Uint32Array(1);
      // rejection sampling for uniformity
      const limit = Math.floor(0xFFFFFFFF / max) * max;
      let r;
      do {
        crypto.getRandomValues(arr);
        r = arr[0];
      } while (r >= limit);
      return r % max;
    }

    function buildPool() {
      let pool = '';
      const sets = [];
      if ($('opt-upper').checked) { pool += UPPER; sets.push(UPPER); }
      if ($('opt-lower').checked) { pool += LOWER; sets.push(LOWER); }
      if ($('opt-num').checked)   { pool += NUMS;  sets.push(NUMS);  }
      if ($('opt-sym').checked)   { pool += SYMS;  sets.push(SYMS);  }
      if ($('opt-no-amb').checked) {
        pool = pool.split('').filter(c => !AMBIG.includes(c)).join('');
        sets.forEach((s, i) => sets[i] = s.split('').filter(c => !AMBIG.includes(c)).join(''));
      }
      return { pool, sets: sets.filter(s => s.length > 0) };
    }

    function generate(len) {
      const { pool, sets } = buildPool();
      if (!pool) return '';
      len = Math.max(1, len);
      const out = new Array(len);
      // Ensure at least one from each selected set (if length allows)
      const guaranteed = Math.min(sets.length, len);
      for (let i = 0; i < guaranteed; i++) {
        out[i] = sets[i][randInt(sets[i].length)];
      }
      for (let i = guaranteed; i < len; i++) {
        out[i] = pool[randInt(pool.length)];
      }
      // Fisher-Yates shuffle
      for (let i = out.length - 1; i > 0; i--) {
        const j = randInt(i + 1);
        [out[i], out[j]] = [out[j], out[i]];
      }
      return out.join('');
    }

    function strength(pw) {
      if (!pw) return { score: 0, label: '—' };
      let variety = 0;
      if (/[a-z]/.test(pw)) variety++;
      if (/[A-Z]/.test(pw)) variety++;
      if (/[0-9]/.test(pw)) variety++;
      if (/[^a-zA-Z0-9]/.test(pw)) variety++;
      const len = pw.length;
      let score = 0;
      if (len >= 8)  score += 1;
      if (len >= 12) score += 1;
      if (len >= 16) score += 1;
      if (len >= 24) score += 1;
      score += variety - 1; // 0..3
      score = Math.max(0, Math.min(7, score));
      let label, pct;
      if (score <= 1)      { label = 'Weak';        pct = 20; }
      else if (score <= 3) { label = 'Medium';      pct = 45; }
      else if (score <= 5) { label = 'Strong';      pct = 75; }
      else                 { label = 'Very Strong'; pct = 100; }
      return { score, label, pct };
    }

    function updateStrength(pw) {
      const s = strength(pw);
      const fill = $('strength-fill'), lab = $('strength-label');
      fill.style.width = s.pct + '%';
      lab.textContent = s.label;
      const colors = { 'Weak':'#E8384F', 'Medium':'#FF6B35', 'Strong':'#00B8A9', 'Very Strong':'#00B8A9', '—':'#9ca3af' };
      lab.style.color = colors[s.label] || '#9ca3af';
    }

    function renderOne() {
      const len = parseInt($('length').value, 10);
      const pw = generate(len);
      $('pw-display').textContent = pw || '— select at least one character set —';
      updateStrength(pw);
    }

    function renderBatch() {
      const len = parseInt($('length').value, 10);
      const list = $('batch-list');
      list.innerHTML = '';
      for (let i = 0; i < 5; i++) {
        const pw = generate(len);
        const row = document.createElement('div');
        row.className = 'flex items-center justify-between gap-3 p-3 rounded-lg';
        row.style.background = 'rgba(255,255,255,0.04)';
        row.style.border = '1px solid rgba(255,255,255,0.05)';
        row.innerHTML = `
          <code class="font-mono text-sm break-all" style="color:#00B8A9;">${pw}</code>
          <button class="btn-secondary shrink-0" style="padding:0.35rem 0.75rem;font-size:0.75rem;" data-pw="${pw.replace(/"/g,'&quot;')}">Copy</button>
        `;
        row.querySelector('button').addEventListener('click', (e) => {
          navigator.clipboard.writeText(e.currentTarget.dataset.pw).then(() => CL.toast('Password copied'));
        });
        list.appendChild(row);
      }
      $('batch-wrap').classList.remove('hidden');
    }

    // Wire events
    $('length').addEventListener('input', (e) => {
      $('length-val').textContent = e.target.value;
      renderOne();
    });
    ['opt-upper','opt-lower','opt-num','opt-sym','opt-no-amb'].forEach(id => {
      $(id).addEventListener('change', renderOne);
    });
    $('generate-btn').addEventListener('click', renderOne);
    $('batch-btn').addEventListener('click', renderBatch);
    $('copy-btn').addEventListener('click', () => {
      const pw = $('pw-display').textContent;
      if (!pw || pw.startsWith('—')) { CL.toast('Nothing to copy', false); return; }
      navigator.clipboard.writeText(pw).then(() => CL.toast('Password copied'));
    });

    // Initial
    renderOne();
  </script>
</body>
</html>
