<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Guess the secret word letter by letter before you run out of attempts. Multiple categories.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    :root {
      --brand-orange: #FF6B35;
      --brand-red: #E8384F;
      --brand-teal: #00B8A9;
      --bg: #ffffff;
      --bg-card: #f8f9fa;
      --bg-alt: #f1f3f5;
      --text: #111111;
      --text-muted: #6b7280;
      --border: #e5e7eb;
    }
    .dark {
      --bg: #0a0a0a;
      --bg-card: #1a1a1a;
      --bg-alt: #111111;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: rgba(255,255,255,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    /* NAV */
    nav {
      padding: 1rem 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 40;
      background: var(--bg);
      backdrop-filter: blur(10px);
    }
    .nav-logo {
      font-size: 1.1rem; font-weight: 800;
      background: linear-gradient(135deg, #FF6B35, #E8384F, #00B8A9);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .nav-right { display: flex; align-items: center; gap: 0.75rem; }
    .theme-btn {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg-alt); color: var(--text);
      cursor: pointer; font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .theme-btn:hover { background: var(--bg-card); }

    /* MAIN */
    main { max-width: 800px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
    header { text-align: center; margin-bottom: 2rem; }
    .badge {
      display: inline-block; padding: 0.25rem 0.75rem;
      border-radius: 9999px; font-size: 0.75rem; font-weight: 600;
      background: linear-gradient(135deg, #FF6B35, #E8384F, #00B8A9);
      color: #fff; margin-bottom: 0.75rem;
    }
    h1 { font-size: 2.25rem; font-weight: 800; margin-bottom: 0.5rem; }
    .subtitle { color: var(--text-muted); font-size: 0.9375rem; max-width: 420px; margin: 0 auto; }

    /* CARD */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 2rem 1.5rem;
    }

    /* CATEGORIES */
    .cat-scroll {
      display: flex; gap: 0.5rem; overflow-x: auto;
      padding-bottom: 0.5rem; margin-bottom: 1.5rem;
      scrollbar-width: thin; scrollbar-color: var(--border) transparent;
    }
    .cat-btn {
      flex-shrink: 0;
      padding: 0.4rem 0.9rem; border-radius: 9999px;
      font-size: 0.8125rem; font-weight: 600;
      border: 1px solid var(--border);
      background: var(--bg); color: var(--text-muted);
      cursor: pointer; transition: all 0.2s ease; white-space: nowrap;
    }
    .cat-btn:hover { border-color: var(--brand-orange); color: var(--brand-orange); }
    .cat-btn.active {
      background: linear-gradient(135deg, #FF6B35, #E8384F, #00B8A9);
      color: #fff; border-color: transparent;
    }

    /* GAME LAYOUT */
    .game-layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 2rem;
      align-items: start;
    }
    @media (max-width: 580px) {
      .game-layout { grid-template-columns: 1fr; }
      .hangman-wrap { display: flex; justify-content: center; }
    }

    /* HANGMAN SVG */
    .hangman-wrap { position: relative; }
    #hangman-svg {
      width: 200px; height: 220px;
      display: block;
    }
    #hangman-svg .gallows { stroke: var(--text); stroke-width: 4; fill: none; stroke-linecap: round; }
    #hangman-svg .body-part {
      stroke: var(--brand-red); stroke-width: 4; fill: none;
      stroke-linecap: round;
      opacity: 0;
      transition: opacity 0.35s ease, stroke-dashoffset 0.4s ease;
    }
    #hangman-svg .body-part.show { opacity: 1; }

    /* RIGHT PANEL */
    .right-panel {}

    /* META */
    .game-meta {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1rem;
    }
    .cat-label { font-size: 0.8125rem; color: var(--text-muted); }
    .cat-label strong { color: var(--text); }
    .wrong-count {
      font-size: 0.8125rem; font-weight: 700;
      color: var(--brand-red);
    }

    /* WORD DISPLAY */
    .word-display {
      display: flex; justify-content: center; gap: 0.35rem;
      flex-wrap: wrap; margin: 1rem 0;
    }
    .letter-slot {
      width: 2rem; height: 2.75rem;
      display: flex; align-items: flex-end; justify-content: center;
      padding-bottom: 0.2rem;
      border-bottom: 3px solid var(--text-muted);
      font-size: 1.375rem; font-weight: 800;
      text-transform: uppercase; line-height: 1;
    }
    .letter-slot.space { border-bottom: none; width: 0.75rem; }
    .letter-slot.revealed { border-bottom-color: var(--brand-teal); color: var(--brand-teal); }
    .letter-slot.missed { color: var(--brand-red); opacity: 0.7; border-bottom-color: var(--brand-red); }

    /* HINT */
    .hint-section { margin: 0.75rem 0; }
    .hint-btn {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.45rem 0.85rem; border-radius: 8px;
      border: 1px dashed var(--border);
      background: transparent; color: var(--text-muted);
      font-size: 0.8125rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }
    .hint-btn:hover:not(:disabled) { border-color: var(--brand-orange); color: var(--brand-orange); }
    .hint-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .hint-text {
      margin-top: 0.6rem; padding: 0.65rem 0.85rem;
      background: var(--bg-alt); border-radius: 8px;
      border-left: 3px solid var(--brand-orange);
      font-size: 0.8125rem; color: var(--text); line-height: 1.5;
      display: none;
    }
    .hint-text.show { display: block; }

    /* KEYBOARD */
    .keyboard {
      display: flex; flex-wrap: wrap; justify-content: center;
      gap: 0.3rem; margin-top: 1rem;
    }
    .key {
      width: 34px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.8125rem;
      text-transform: uppercase;
      background: var(--bg-alt); color: var(--text);
      border-radius: 6px; border: 1px solid var(--border);
      cursor: pointer; user-select: none;
      transition: background 0.12s ease, transform 0.08s ease;
      font-family: 'Inter', sans-serif;
    }
    .key:hover:not(:disabled) { border-color: var(--brand-orange); color: var(--brand-orange); }
    .key:active:not(:disabled) { transform: scale(0.88); }
    .key.correct { background: var(--brand-teal); color: #fff; border-color: var(--brand-teal); }
    .key.wrong { background: #9ca3af; color: #fff; border-color: transparent; }
    .key:disabled { cursor: not-allowed; opacity: 0.7; }

    /* MODAL */
    #modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 60;
      display: flex; align-items: center; justify-content: center; padding: 1.5rem;
      opacity: 0; visibility: hidden; transition: opacity 0.25s, visibility 0.25s;
    }
    #modal-backdrop.show { opacity: 1; visibility: visible; }
    #modal {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 1.25rem; padding: 2rem 1.75rem;
      max-width: 360px; width: 100%; text-align: center;
      transform: translateY(18px) scale(0.97);
      transition: transform 0.25s ease;
      box-shadow: 0 24px 60px rgba(0,0,0,0.25);
    }
    #modal-backdrop.show #modal { transform: translateY(0) scale(1); }
    .modal-emoji { font-size: 3.5rem; margin-bottom: 0.75rem; }
    .modal-title { font-size: 1.375rem; font-weight: 800; margin-bottom: 0.5rem; }
    .modal-sub { font-size: 0.875rem; color: var(--text-muted); margin-bottom: 0.35rem; }
    .modal-word {
      font-size: 1.75rem; font-weight: 900; letter-spacing: 0.08em;
      background: linear-gradient(135deg, #FF6B35, #E8384F, #00B8A9);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 1.5rem;
    }
    .play-again-btn {
      display: block; width: 100%; padding: 0.75rem;
      border-radius: 0.75rem; border: none; cursor: pointer;
      font-size: 1rem; font-weight: 700; font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #FF6B35, #E8384F, #00B8A9);
      color: #fff; transition: opacity 0.2s;
    }
    .play-again-btn:hover { opacity: 0.9; }

    /* FOOTER */
    footer {
      text-align: center; padding: 2rem;
      border-top: 1px solid var(--border);
      color: var(--text-muted); font-size: 0.8125rem; margin-top: 3rem;
    }
    footer a { color: var(--brand-orange); text-decoration: none; }

    /* TOAST */
    #toast {
      position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--text); color: var(--bg);
      padding: 0.625rem 1.25rem; border-radius: 999px;
      font-size: 0.875rem; font-weight: 600;
      z-index: 99; transition: transform 0.3s ease, opacity 0.3s ease;
      opacity: 0; white-space: nowrap; pointer-events: none;
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    .keyboard-tip { text-align: center; font-size: 0.75rem; color: var(--text-muted); margin-top: 0.75rem; }

    /* Progress bar */
    .progress-bar-wrap { height: 4px; border-radius: 2px; background: var(--bg-alt); margin-bottom: 1.25rem; overflow: hidden; }
    .progress-bar { height: 100%; border-radius: 2px; background: linear-gradient(90deg, #FF6B35, #E8384F); transition: width 0.4s ease; }
  </style>
</head>

        { word: 'DRACULA', hint: 'Bram Stoker\'s 1897 Gothic horror novel about a Transylvanian vampire.' },
        { word: 'FITZGERALD', hint: 'The author of The Great Gatsby — F. Scott ___.' },
        { word: 'MOBY DICK', hint: 'Herman Melville\'s novel about Captain Ahab\'s obsession with a white whale.' },
        { word: 'FRANKENSTEIN', hint: 'Mary Shelley\'s 1818 novel about a scientist who creates a living creature.' },
        { word: 'HEMINGWAY', hint: 'American author known for minimalist prose and The Old Man and the Sea.' },
        { word: 'ORWELL', hint: 'Author of 1984 and Animal Farm — George ___.' },
        { word: 'GATSBY', hint: 'The mysterious millionaire at the heart of Fitzgerald\'s most famous novel.' },
        { word: 'DOSTOEVSKY', hint: 'Russian author of Crime and Punishment and The Brothers Karamazov.' },
        { word: 'ILIAD', hint: 'Homer\'s epic poem about the Trojan War and the wrath of Achilles.' },
        { word: 'AUSTEN', hint: 'English author of Pride and Prejudice — Jane ___.' },
        { word: 'QUIXOTE', hint: 'The delusional knight-errant hero of Cervantes\'s masterpiece — Don ___.' },
        { word: 'TOLKIEN', hint: 'The author who created Middle-earth and wrote The Lord of the Rings.' },
      ]
    }
  };

  const MAX_WRONG = 6;

  /* ── STATE ── */
  let category = 'animals';
  let word = '';
  let hint = '';
  let guessed = new Set();
  let wrongCount = 0;
  let gameOver = false;
  let hintUsed = false;

  /* ── ELEMENTS ── */
  const wordEl = document.getElementById('word-display');
  const keyboardEl = document.getElementById('keyboard');
  const catLabelEl = document.getElementById('cat-label');
  const wrongCountEl = document.getElementById('wrong-count');
  const progressBar = document.getElementById('progress-bar');
  const modalBackdrop = document.getElementById('modal-backdrop');
  const modalEmoji = document.getElementById('modal-emoji');
  const modalTitle = document.getElementById('modal-title');
  const modalWord = document.getElementById('modal-word');
  const modalBtn = document.getElementById('modal-btn');
  const hintBtn = document.getElementById('hint-btn');
  const hintText = document.getElementById('hint-text');
  const toastEl = document.getElementById('toast');

  /* ── HANGMAN SVG PARTS ── */
  const bodyParts = [
    document.getElementById('bp-0'),
    document.getElementById('bp-1'),
    document.getElementById('bp-2'),
    document.getElementById('bp-3'),
    document.getElementById('bp-4'),
    document.getElementById('bp-5'),
  ];

  function updateHangman() {
    bodyParts.forEach((part, i) => {
      part.classList.toggle('show', i < wrongCount);
    });
  }

  /* ── WORD RENDERING ── */
  function renderWord() {
    wordEl.innerHTML = '';
    word.split('').forEach(ch => {
      const slot = document.createElement('div');
      if (ch === ' ') {
        slot.className = 'letter-slot space';
      } else {
        slot.className = 'letter-slot';
        if (guessed.has(ch)) {
          slot.textContent = ch;
          slot.classList.add('revealed');
        } else if (gameOver) {
          slot.textContent = ch;
          slot.classList.add('missed');
        }
      }
      wordEl.appendChild(slot);
    });
  }

  /* ── KEYBOARD ── */
  function buildKeyboard() {
    keyboardEl.innerHTML = '';
    'QWERTYUIOPASDFGHJKLZXCVBNM'.split('').forEach(letter => {
      const btn = document.createElement('button');
      btn.className = 'key';
      btn.textContent = letter;
      btn.dataset.letter = letter;
      btn.addEventListener('click', () => guessLetter(letter));
      keyboardEl.appendChild(btn);
    });
  }

  /* ── GUESS ── */
  function guessLetter(letter) {
    if (gameOver || guessed.has(letter)) return;
    guessed.add(letter);
    const btn = keyboardEl.querySelector(`[data-letter="${letter}"]`);

    if (word.includes(letter)) {
      if (btn) { btn.classList.add('correct'); btn.disabled = true; }
      renderWord();
      checkWin();
    } else {
      wrongCount++;
      if (btn) { btn.classList.add('wrong'); btn.disabled = true; }
      updateHangman();
      updateMeta();
      if (wrongCount >= MAX_WRONG) endGame(false);
    }
  }

  function updateMeta() {
    wrongCountEl.textContent = `${wrongCount} / ${MAX_WRONG} wrong`;
    progressBar.style.width = `${(wrongCount / MAX_WRONG) * 100}%`;
  }

  function checkWin() {
    const allGuessed = word.split('').every(ch => ch === ' ' || guessed.has(ch));
    if (allGuessed) endGame(true);
  }

  /* ── END GAME ── */
  function endGame(won) {
    gameOver = true;
    renderWord();
    keyboardEl.querySelectorAll('.key').forEach(b => b.disabled = true);
    modalEmoji.textContent = won ? '🎉' : '💀';
    modalTitle.textContent = won ? 'You got it!' : 'Out of guesses!';
    modalWord.textContent = word;
    setTimeout(() => modalBackdrop.classList.add('show'), 450);
    showToast(won ? `🎉 You guessed it — ${word}!` : `The word was ${word}`);
  }

  /* ── HINT ── */
  hintBtn.addEventListener('click', () => {
    if (hintUsed || gameOver) return;
    hintUsed = true;
    hintText.textContent = `💡 ${hint}`;
    hintText.classList.add('show');
    hintBtn.disabled = true;
    hintBtn.textContent = '💡 Hint used';
  });

  /* ── NEW GAME ── */
  function newGame() {
    const list = DATA[category].words;
    const entry = list[Math.floor(Math.random() * list.length)];
    word = entry.word;
    hint = entry.hint;
    guessed = new Set();
    wrongCount = 0;
    gameOver = false;
    hintUsed = false;

    catLabelEl.textContent = DATA[category].label.split(' ').slice(1).join(' ');
    updateMeta();
    updateHangman();
    renderWord();
    buildKeyboard();
    modalBackdrop.classList.remove('show');
    hintBtn.disabled = false;
    hintBtn.textContent = '💡 Show Hint';
    hintText.textContent = '';
    hintText.classList.remove('show');
  }

  /* ── TOAST ── */
  let toastTimer;
  function showToast(msg) {
    clearTimeout(toastTimer);
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3000);
  }

  /* ── EVENTS ── */
  document.addEventListener('keydown', (e) => {
    const key = e.key.toUpperCase();
    if (/^[A-Z]$/.test(key)) guessLetter(key);
  });

  document.querySelectorAll('.cat-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      category = btn.dataset.cat;
      newGame();
    });
  });

  modalBtn.addEventListener('click', newGame);

  /* ── DARK MODE ── */
  const themeBtn = document.getElementById('theme-toggle');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (prefersDark) document.documentElement.classList.add('dark');
  themeBtn.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';

  themeBtn.addEventListener('click', () => {
    document.documentElement.classList.toggle('dark');
    themeBtn.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
  });

  /* ── INIT ── */
  newGame();
})();
