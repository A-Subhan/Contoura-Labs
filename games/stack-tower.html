<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stack Tower — Contoura Labs</title>
  <meta name="description" content="Precision stacking game. Tap to drop moving blocks and build the tallest tower without missing.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M 73 28 A 32 32 0 0 0 27 28' stroke='%23FF6B35' stroke-width='9' fill='none' stroke-linecap='round'/><path d='M 24 32 A 32 32 0 0 0 24 68' stroke='%23E8384F' stroke-width='9' fill='none' stroke-linecap='round'/><path d='M 27 72 A 32 32 0 0 0 73 72' stroke='%2300B8A9' stroke-width='9' fill='none' stroke-linecap='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {
        colors: {
          brand: { orange: '#FF6B35', red: '#E8384F', teal: '#00B8A9' },
          surface: { light: '#F8F9FA', dark: '#0A0A0A', card: '#1A1A1A', alt: '#111111' }
        },
        fontFamily: { sans: ['Inter', 'sans-serif'] }
      }}
    }
  </script>
  <link rel="stylesheet" href="../assets/css/common.css">
  <style>
    #st-wrap { display: flex; justify-content: center; }
    #st-canvas {
      background: linear-gradient(180deg, #cfe8f3 0%, #f3f8fb 100%);
      border-radius: 1rem;
      display: block;
      max-width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.12);
      touch-action: manipulation;
      cursor: pointer;
    }
    .dark #st-canvas { background: linear-gradient(180deg, #0f2027 0%, #1a1a2e 100%); }
    .st-stat {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.4rem 0.9rem; border-radius: 9999px; font-size: 0.875rem; font-weight: 700;
      background: rgba(0,184,169,0.1); color: #00B8A9; font-variant-numeric: tabular-nums;
    }
    .st-stat.red { background: rgba(232,56,79,0.1); color: #E8384F; }
    #st-overlay {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; text-align: center; background: rgba(255,255,255,0.85);
      border-radius: 1rem; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease;
      gap: 0.75rem;
    }
    .dark #st-overlay { background: rgba(10,10,10,0.85); }
    #st-overlay.show { opacity: 1; visibility: visible; }
    #st-canvas-wrap { position: relative; }
  </style>
</head>
<body class="font-sans bg-white text-gray-900 dark:bg-surface-dark dark:text-gray-100 antialiased">

  <div id="navbar-mount"></div>

  <main class="tool-page">
    <div class="tool-container">
      <header class="tool-header">
        <span class="badge mb-3">Games</span>
        <h1 class="tool-title">Stack Tower</h1>
        <p class="tool-subtitle">Tap or click to drop each block. Line it up with the one below — misaligned parts get sliced off. Build the tallest tower you can.</p>
      </header>

      <div class="tool-card">
        <div class="flex items-center justify-center gap-3 mb-5">
          <span class="st-stat">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 21h18M6 21V8l6-5 6 5v13M9 21v-6h6v6"/></svg>
            <span id="st-height">0</span>
          </span>
          <span class="st-stat red">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
            Best: <span id="st-best">0</span>
          </span>
        </div>

        <div id="st-canvas-wrap" class="relative">
          <div id="st-wrap"><canvas id="st-canvas" width="400" height="560"></canvas></div>
          <div id="st-overlay">
            <div class="text-5xl">🏗️</div>
            <h3 id="st-overlay-title" class="text-xl font-bold">Tower Collapsed!</h3>
            <p class="text-sm text-gray-500 dark:text-gray-400">Height: <span id="st-overlay-height">0</span> blocks</p>
            <button id="st-restart" class="btn-primary mt-2">Play Again</button>
          </div>
        </div>

        <div class="text-center mt-6 text-xs text-gray-400">
          <p><strong>Click / Tap</strong> or press <strong>Space</strong> to drop the block.</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-8 border-t border-gray-100 dark:border-white/5 mt-12">
    <div class="max-w-6xl mx-auto px-6 flex flex-col sm:flex-row items-center justify-between gap-3">
      <p class="text-xs text-gray-400">© 2025 Contoura Labs</p>
      <a href="index.html" class="text-xs text-brand-orange hover:text-brand-red transition-colors">← Back to all games</a>
    </div>
  </footer>

  <script src="../assets/js/common.js"></script>
  <script>
  (function () {
    'use strict';

    const canvas = document.getElementById('st-canvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    const heightEl = document.getElementById('st-height');
    const bestEl = document.getElementById('st-best');
    const overlay = document.getElementById('st-overlay');
    const overlayTitle = document.getElementById('st-overlay-title');
    const overlayHeight = document.getElementById('st-overlay-height');
    const restartBtn = document.getElementById('st-restart');

    const BLOCK_H = 28;
    const BASE_W = 180;
    const COLORS = ['#FF6B35', '#E8384F', '#00B8A9', '#F7B32B', '#5C6BC0', '#26A69A'];

    let best = 0;
    try { best = parseInt(localStorage.getItem('st-best') || '0', 10); } catch (e) {}
    bestEl.textContent = best;

    let stack = [];      // placed blocks: {x, w, y, color}
    let current = null;  // moving block: {x, w, y, dir, speed, color}
    let cameraY = 0;      // vertical offset to scroll view as tower grows
    let score = 0;
    let gameOver = false;
    let running = false;

    function colorFor(i) { return COLORS[i % COLORS.length]; }

    function resetGame() {
      stack = [{ x: (W - BASE_W) / 2, w: BASE_W, y: H - BLOCK_H, color: '#9ca3af' }];
      score = 0;
      cameraY = 0;
      gameOver = false;
      running = true;
      overlay.classList.remove('show');
      heightEl.textContent = score;
      spawnBlock();
    }

    function spawnBlock() {
      const last = stack[stack.length - 1];
      const w = last.w;
      const speed = 2.2 + score * 0.07;
      const fromLeft = score % 2 === 0;
      current = {
        x: fromLeft ? -w : W,
        w: w,
        y: last.y - BLOCK_H,
        dir: fromLeft ? 1 : -1,
        speed: Math.min(speed, 7.5),
        color: colorFor(score)
      };
    }

    function drop() {
      if (gameOver || !current) return;
      const last = stack[stack.length - 1];
      const overlapLeft = Math.max(current.x, last.x);
      const overlapRight = Math.min(current.x + current.w, last.x + last.w);
      const overlapW = overlapRight - overlapLeft;

      if (overlapW <= 4) {
        // total miss
        endGame();
        return;
      }

      const newBlock = { x: overlapLeft, w: overlapW, y: current.y, color: current.color };
      stack.push(newBlock);
      score++;
      heightEl.textContent = score;

      // scroll camera up if tower is tall
      const topY = newBlock.y;
      if (topY - cameraY < 160) {
        cameraY = topY - 160;
      }

      spawnBlock();
    }

    function endGame() {
      gameOver = true;
      running = false;
      if (score > best) {
        best = score;
        try { localStorage.setItem('st-best', String(best)); } catch (e) {}
        bestEl.textContent = best;
      }
      overlayTitle.textContent = score > 0 ? 'Tower Collapsed!' : 'Missed Completely!';
      overlayHeight.textContent = score;
      setTimeout(() => overlay.classList.add('show'), 250);
      CL.toast(score >= best && score > 0 ? `🏆 New best: ${score} blocks!` : `Tower fell at ${score} blocks`, score > 0);
    }

    function update() {
      if (!running || gameOver || !current) return;
      current.x += current.dir * current.speed;
      if (current.dir > 0 && current.x + current.w > W + 40) {
        current.x = W + 40 - current.w;
        current.dir = -1;
      } else if (current.dir < 0 && current.x < -40) {
        current.x = -40;
        current.dir = 1;
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // draw placed blocks
      for (let i = 0; i < stack.length; i++) {
        const b = stack[i];
        const drawY = b.y - cameraY;
        if (drawY > H || drawY < -BLOCK_H) continue;
        ctx.fillStyle = b.color;
        roundRect(ctx, b.x, drawY, b.w, BLOCK_H - 2, 4);
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.08)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      // draw moving block
      if (current && !gameOver) {
        const drawY = current.y - cameraY;
        ctx.fillStyle = current.color;
        roundRect(ctx, current.x, drawY, current.w, BLOCK_H - 2, 4);
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.1)';
        ctx.stroke();
      }
    }

    function roundRect(c, x, y, w, h, r) {
      c.beginPath();
      c.moveTo(x + r, y);
      c.arcTo(x + w, y, x + w, y + h, r);
      c.arcTo(x + w, y + h, x, y + h, r);
      c.arcTo(x, y + h, x, y, r);
      c.arcTo(x, y, x + w, y, r);
      c.closePath();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    canvas.addEventListener('click', () => {
      if (gameOver) return;
      drop();
    });
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        if (gameOver) return;
        drop();
      }
    });
    restartBtn.addEventListener('click', resetGame);

    resetGame();
    loop();
  })();
  </script>
</body>
</html>
