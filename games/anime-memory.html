  <style>
    .aq-screen { animation: aqFade 0.4s cubic-bezier(0.16,1,0.3,1) both; }

    .aq-hidden { display: none !important; }

    .anime-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0.75rem; margin: 1rem 0; }
    .anime-card { padding: 1rem 0.75rem; border-radius: 0.75rem; border: 2px solid #e5e7eb; background: #fff; cursor: pointer; transition: all 0.2s ease; text-align: center; }

    .anime-card:hover { border-color: var(--brand-orange); transform: translateY(-3px); box-shadow: 0 8px 20px rgba(255,107,53,0.12); }

    .anime-name { font-weight: 700; font-size: 0.82rem; }
    .anime-questions { font-size: 0.65rem; color: #9ca3af; margin-top: 0.2rem; }

    .aq-option { display: flex; align-items: center; gap: 0.75rem; padding: 0.85rem 1rem; border-radius: 0.6rem; border: 2px solid #e5e7eb; background: #fff; cursor: pointer; transition: all 0.2s ease; font-size: 0.875rem; font-weight: 500; width: 100%; text-align: left; font-family: 'Inter', sans-serif; }
    .dark .aq-option { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.1); color: #e5e7eb; }
    .aq-option:hover:not(.locked) { border-color: var(--brand-orange); }
    .aq-option.correct { border-color: var(--brand-teal); background: rgba(0,184,169,0.1); }
    .aq-option.wrong { border-color: var(--brand-red); background: rgba(232,56,79,0.1); }
    .aq-option.locked { cursor: default; }
    .aq-option-letter { width: 28px; height: 28px; border-radius: 0.35rem; background: #f3f4f6; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.75rem; color: #6b7280; flex-shrink: 0; }
    .dark .aq-option-letter { background: rgba(255,255,255,0.08); color: #9ca3af; }
    .aq-option.correct .aq-option-letter { background: var(--brand-teal); color: #fff; }
    .aq-option.wrong .aq-option-letter { background: var(--brand-red); color: #fff; }

    .score-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; margin-bottom: 0.75rem; }
    .score-card { text-align: center; padding: 0.5rem 0.3rem; border-radius: 0.6rem; background: rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.05); }
    .dark .score-card { background: rgba(255,255,255,0.03); border-color: rgba(255,255,255,0.05); }
    .score-num { font-size: 1.2rem; font-weight: 800; line-height: 1; }
    .score-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.05em; color: #9ca3af; margin-top: 0.15rem; font-weight: 600; }

        { q: 'What are the three starter Pokemon in Kanto?', correct: 'Bulbasaur, Charmander, Squirtle', wrong: ['Pikachu, Eevee, Jigglypuff','Mewtwo, Mew, Celebi','Magikarp, Gyarados, Lapras'] },
        { q: 'What is the Pokemon motto?', correct: 'Gotta catch them all!', wrong: ['I choose you!','Battle on!','Be the very best!'] },
        { q: 'Who gives trainers their first Pokemon?', correct: 'Professor Oak', wrong: ['Nurse Joy','Officer Jenny','Giovanni'] },
        { q: 'What is the evil organization called?', correct: 'Team Rocket', wrong: ['Team Plasma','Team Magma','Team Galactic'] },
        { q: 'What evolves into Charizard?', correct: 'Charmeleon', wrong: ['Charmander','Bulbasaur','Squirtle'] }
      ]},
      'Sailor Moon': { emoji: '🌙', questions: [
        { q: 'What is the name of the main character?', correct: 'Usagi Tsukino (Serena)', wrong: ['Ami Mizuno','Rei Hino','Minako Aino'] },
        { q: 'What is Sailor Moon cat name?', correct: 'Luna', wrong: ['Artemis','Diana','Selene'] },
        { q: 'What is Sailor Moon transformation phrase?', correct: 'Moon Prism Power, Make Up!', wrong: ['Mercury Power, Make Up!','Mars Power, Make Up!','Venus Power, Make Up!'] },
        { q: 'How many Sailor Senshi are there in the original team?', correct: '5', wrong: ['3','7','10'] },
        { q: 'Who is Sailor Moon love interest?', correct: 'Tuxedo Mask (Mamoru)', wrong: ['Prince Endymion','Helios','Seiya'] },
        { q: 'What is Sailor Moon signature attack?', correct: 'Moon Tiara Action', wrong: ['Mars Flame Sniper','Mercury Aqua Mirage','Venus Love-Me Chain'] },
        { q: 'What is the name of the magical item Sailor Moon uses?', correct: 'Silver Crystal', wrong: ['Golden Crystal','Pink Crystal','Rose Crystal'] },
        { q: 'Who is the leader of the Sailor Senshi?', correct: 'Sailor Moon', wrong: ['Sailor Venus','Sailor Mars','Sailor Mercury'] },
        { q: 'What is Sailor Moon future daughter name?', correct: 'Chibiusa (Rini)', wrong: ['Hotaru','Setsuna','Haruka'] },
        { q: 'What planet is Sailor Mercury associated with?', correct: 'Mercury', wrong: ['Venus','Mars','Jupiter'] }
      ]},
      'Cowboy Bebop': { emoji: '🤠', questions: [
        { q: 'What is the name of the main character?', correct: 'Spike Spiegel', wrong: ['Jet Black','Faye Valentine','Ed'] },
        { q: 'What is the name of the spaceship?', correct: 'Bebop', wrong: ['Swordfish II','Red Tail','Hammerhead'] },
        { q: 'What is Spike fighting style?', correct: 'Jeet Kune Do', wrong: ['Karate','Boxing','Kung Fu'] },
        { q: 'Who is Spike former partner?', correct: 'Vicious', wrong: ['Jet','Faye','Julia'] },
        { q: 'What is Jet arm made of?', correct: 'Metal prosthetic', wrong: ['Wood','Plastic','Nothing'] },
        { q: 'What is the name of the data dog?', correct: 'Ein', wrong: ['Ed','Spike','Faye'] },
        { q: 'What is the opening theme song called?', correct: 'Tank!', wrong: ['The Real Folk Blues','Space Lion','Blue'] },
        { q: 'What is Faye real name?', correct: 'Faye Valentine', wrong: ['Faye Resnick','Faye Wong','Faye Dunaway'] },
        { q: 'What is Ed full name?', correct: 'Edward Wong Hau Pepelu Tivrusky IV', wrong: ['Ed Ein','Ed Bebop','Ed Spike'] },
        { q: 'What is Spike catchphrase about life?', correct: 'See you, space cowboy', wrong: ['Bang','Goodnight','Adios'] }
      ]},
      'Hunter x Hunter': { emoji: '🎣', questions: [
        { q: 'What is the name of the main character?', correct: 'Gon Freecss', wrong: ['Killua Zoldyck','Kurapika','Leorio'] },
        { q: 'What is Gon looking for?', correct: 'His father Ging', wrong: ['The Hunter Exam','The Phantom Troupe','The Dark Continent'] },
        { q: 'What is Killua family business?', correct: 'Assassins', wrong: ['Hunters','Thieves','Merchants'] },
        { q: 'What is the power system called?', correct: 'Nen', wrong: ['Haki','Chakra','Ki'] },
        { q: 'What Nen type is Gon?', correct: 'Enhancer', wrong: ['Transmuter','Conjurer','Emitter'] },
        { q: 'Who is the leader of the Phantom Troupe?', correct: 'Chrollo Lucilfer', wrong: ['Hisoka','Illumi','Meruem'] },
        { q: 'What is the name of the Hunter Exam?', correct: 'The Hunter Examination', wrong: ['The Nen Test','The Hunter Games','The Hunter Trial'] },
        { q: 'What is Hisoka favorite phrase?', correct: 'I am strong because you are weak', wrong: ['Bungee Gum has the properties of rubber and gum','Magicians are the best','I love fighting strong opponents'] },
        { q: 'What is the strongest Nen beast called?', correct: 'Meruem (Chimera Ant King)', wrong: ['Neferpitou','Shaiapouf','Menthuthuyoupi'] },
        { q: 'What is Killua signature attack?', correct: 'Lightning Palm (Godspeed)', wrong: ['Paper','Rock','Scissors'] }
      ]}
    };

    const STATS_KEY = 'contoura-stats-anime-quiz-v1';
    let stats = (function() {
      try { return JSON.parse(localStorage.getItem(STATS_KEY)) || { won: 0, lost: 0, bestScore: 0 }; }
      catch (e) { return { won: 0, lost: 0, bestScore: 0 }; }
    })();
    function saveStats() { try { localStorage.setItem(STATS_KEY, JSON.stringify(stats)); } catch (e) {} }
    function updateScoreBoard() {
      $('sb-won').textContent = stats.won;
      $('sb-lost').textContent = stats.lost;
      var total = stats.won + stats.lost;
      $('sb-pct').textContent = total > 0 ? Math.round(stats.won / total * 100) + '%' : '0%';
      $('sb-best').textContent = stats.bestScore;
    }

    const $ = (id) => document.getElementById(id);
    let selectedAnime = null;
    let questions = [];
    let currentIdx = 0;
    let score = 0;
    let locked = false;

    function buildAnimeGrid() {
      const grid = $('anime-grid');
      grid.innerHTML = '';
      Object.keys(ANIME_DATA).forEach(name => {
        const anime = ANIME_DATA[name];
        const card = document.createElement('div');
        card.className = 'anime-card';
        card.dataset.anime = name;
        card.innerHTML = '<div class="anime-emoji">' + anime.emoji + '</div>' +
          '<div class="anime-name">' + name + '</div>' +
          '<div class="anime-questions">' + anime.questions.length + ' questions</div>';
        card.addEventListener('click', () => selectAnime(name));
        grid.appendChild(card);
      });
    }

    function selectAnime(name) {
      selectedAnime = name;
      $('anime-grid').querySelectorAll('.anime-card').forEach(c => {
        c.classList.toggle('selected', c.dataset.anime === name);
      });
      $('start-btn').classList.remove('hidden');
      $('select-hint').textContent = 'Selected: ' + name + ' - click Start to begin';
    }

    $('start-btn').addEventListener('click', () => {
      if (!selectedAnime) return;
      startQuiz();
    });

    function startQuiz() {
      // Shuffle questions and take 10
      const pool = ANIME_DATA[selectedAnime].questions.slice();
      questions = pool.sort(() => Math.random() - 0.5).slice(0, Math.min(10, pool.length));
      // Shuffle options for each question
      questions.forEach(q => {
        const opts = [{ text: q.correct, correct: true }];
        q.wrong.forEach(w => opts.push({ text: w, correct: false }));
        q.shuffled = opts.sort(() => Math.random() - 0.5);
      });
      currentIdx = 0;
      score = 0;
      locked = false;
      $('select-screen').classList.add('aq-hidden');
      $('quiz-screen').classList.remove('aq-hidden');
      $('anime-badge').textContent = ANIME_DATA[selectedAnime].emoji + ' ' + selectedAnime;
      showQuestion();
    }

    function showQuestion() {
      const q = questions[currentIdx];
      $('q-num').textContent = currentIdx + 1;
      $('q-score').textContent = score;
      $('progress').style.width = ((currentIdx + 1) / questions.length * 100) + '%';
      $('question-text').textContent = q.q;

      const optsEl = $('options');
      optsEl.innerHTML = '';
      locked = false;
      q.shuffled.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'aq-option';
        btn.innerHTML = '<span class="aq-option-letter">' + String.fromCharCode(65 + i) + '</span>' + opt.text;
        btn.addEventListener('click', () => answer(btn, opt.correct));
        optsEl.appendChild(btn);
      });
    }

    function answer(btn, isCorrect) {
      if (locked) return;
      locked = true;
      $('options').querySelectorAll('.aq-option').forEach(b => b.classList.add('locked'));

      if (isCorrect) {
        btn.classList.add('correct');
        score++;
      } else {
        btn.classList.add('wrong');
        // Show correct answer
        $('options').querySelectorAll('.aq-option').forEach(b => {
          const text = b.textContent.slice(1);
          if (text === questions[currentIdx].correct) b.classList.add('correct');
        });
      }

      setTimeout(() => {
        if (currentIdx < questions.length - 1) {
          currentIdx++;
          showQuestion();
        } else {
          finishQuiz();
        }
      }, 1200);
    }

    function finishQuiz() {
      const passed = score >= 6;
      if (passed) stats.won++; else stats.lost++;
      if (score > stats.bestScore) stats.bestScore = score;
      saveStats();
      updateScoreBoard();

      let emoji, title;
      if (score >= 8) { emoji = '🏆'; title = 'Excellent!'; }
      else if (score >= 6) { emoji = '👍'; title = 'Good Job!'; }
      else { emoji = '📚'; title = 'Keep Practicing!'; }

      CL.showGameResult({
        emoji: emoji,
        title: title,
        message: 'You scored <strong>' + score + '/' + questions.length + '</strong> in ' + selectedAnime,
        onPlayAgain: function() {
          $('quiz-screen').classList.add('aq-hidden');
          $('select-screen').classList.remove('aq-hidden');
        }
      });
    }

    buildAnimeGrid();
    updateScoreBoard();
  })();
  </script>
